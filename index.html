<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<title>Monopoly Banker</title>
<style>
  :root{
    /* Surfaces */
    --bg:#F5F7FB; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#EDF1F7;
    --line:#C1CAD6; --line-soft:#E2E7EF;
    /* Ink — all pass WCAG AA on white */
    --ink:#1F2338; --ink2:#545A7E; --ink3:#6B7292;
    /* Brand (Folly) — primary buttons, danger, celebration */
    --brand:#FF1053; --brand-btn:#E00047; --brand-ink:#C7003B; --brand-tint:#FFEDF2;
    /* Affirmative (Sky) — collect, saved, leading */
    --sky:#66C7F4; --sky-btn:#2AA3DE; --sky-ink:#0E6F97; --sky-tint:#E8F6FE;
    /* Secondary (Rhythm) — quiet accents, caution */
    --indigo:#6C6EA0; --indigo-ink:#4A4C77; --indigo-tint:#EFEFF7;
    --shadow:0 1px 2px rgba(31,35,56,.06), 0 4px 14px rgba(31,35,56,.06);
    --shadow-lg:0 10px 40px rgba(31,35,56,.16);
    --radius:14px;
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior:none}
  body{display:flex; flex-direction:column}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; touch-action:manipulation}
  input,select{font:inherit}
  h1,h2,h3{margin:0}
  [hidden]{display:none!important}

  #app{flex:1; display:flex; flex-direction:column; min-height:0; max-width:760px; width:100%; margin:0 auto}

  /* ---------- header ---------- */
  .hdr{display:flex; align-items:center; gap:10px; padding:14px 16px 10px}
  .hdr .title{font-size:19px; font-weight:800; letter-spacing:.2px; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hdr .title small{display:block; font-size:11.5px; font-weight:600; color:var(--ink3); letter-spacing:.4px}
  .hbtn{flex:none; border-radius:11px; padding:9px 13px; font-size:13px; font-weight:800;
    background:var(--card); border:1px solid var(--line); color:var(--ink2)}
  .hbtn:active{background:var(--card2)}
  .hbtn.pause{background:var(--brand-tint); border-color:var(--brand); color:var(--brand-ink)}
  .hbtn.pause.on{background:var(--brand-btn); border-color:var(--brand-btn); color:#fff}
  .hbtn.tvbtn{background:var(--sky-tint); border-color:var(--sky); color:var(--sky-ink)}
  .hbtn.tvbtn:active{background:var(--sky); color:#fff}
  /* Game View is a 16:9 TV layout — no point offering it on a phone. Pause stays. */
  .tvbtn{display:none}
  @media (min-width:700px){ .tvbtn{display:inline-block} }
  .iconbtn{width:42px; height:42px; border-radius:12px; background:var(--card); border:1px solid var(--line-soft);
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:18px; flex:none}
  .iconbtn:active{background:var(--card2)}
  .savedot{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink3); font-weight:600}
  .savedot i{width:8px; height:8px; border-radius:50%; background:var(--ink3); display:inline-block}
  .savedot.ok i{background:var(--sky-btn)} .savedot.busy i{background:var(--indigo)} .savedot.err i{background:var(--brand)}

  .scroller{flex:1; overflow-y:auto; padding:0 14px calc(96px + var(--sab)); min-height:0}

  /* ---------- home ---------- */
  .hero{padding:34px 6px 20px; text-align:center}
  .hero .logo{font-size:44px}
  .hero h1{font-size:30px; font-weight:900; margin-top:6px}
  .hero p{color:var(--ink2); margin:8px 0 0; font-size:14.5px}
  .bigbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    padding:17px; border-radius:var(--radius); font-size:17px; font-weight:800;
    background:var(--brand-btn); color:#fff; margin-top:14px; box-shadow:var(--shadow)}
  .bigbtn:active{background:var(--brand-ink)}
  .bigbtn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:var(--shadow)}
  .bigbtn.ghost:active{background:var(--card2)}
  .sect{font-size:12px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink3);
    margin:26px 4px 10px}
  .gamerow{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:14px; margin-bottom:10px; box-shadow:var(--shadow)}
  .gamerow:active{background:var(--card2)}
  .gamerow .gi{flex:1; min-width:0}
  .gamerow .gn{font-weight:800; font-size:16px}
  .gamerow .gm{font-size:12.5px; color:var(--ink2); margin-top:3px}
  .gamerow .del{color:var(--ink3); font-size:17px; padding:8px}
  .note{background:var(--sky-tint); border:1px solid #BFE4F8; border-radius:var(--radius);
    padding:13px 14px; color:var(--ink2); font-size:13.5px; line-height:1.45}
  .note b{color:var(--ink)}
  .linkish{color:var(--sky-ink); font-weight:700; text-decoration:underline; padding:0}
  .acctrow{display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--radius); padding:11px 14px; margin-top:4px; box-shadow:var(--shadow)}
  .avatar{width:36px; height:36px; border-radius:50%; flex:none; object-fit:cover}
  .avph{display:flex; align-items:center; justify-content:center; background:var(--card2); font-size:17px}
  .acctrow .ai{flex:1; min-width:0}
  .acctrow .an{font-weight:800; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .acctrow .ae{font-size:12px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bigbtn.ghost svg{flex:none}

  /* playing pieces */
  svg.tok{display:inline-block; vertical-align:middle; flex:none}
  h2.withtok{display:flex; align-items:center; gap:8px}
  .swatch.tokbtn{background:var(--card2); display:flex; align-items:center; justify-content:center}
  .swatch.tokbtn:active{background:var(--line)}
  .tokgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:2px 0 4px}
  .tokopt{display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 4px 9px;
    border-radius:12px; background:var(--card); border:1px solid var(--line); color:var(--ink2)}
  .tokopt span{font-size:10.5px; font-weight:700; line-height:1.15; text-align:center}
  .tokopt.sel{border-color:var(--sky-btn); background:var(--sky-tint); color:var(--ink)}
  .tokopt:disabled{opacity:.28}
  .tokopt:active:not(:disabled){background:var(--card2)}
  .colopt{width:34px; height:34px; border-radius:50%; border:3px solid transparent}
  .colopt.sel{border-color:var(--ink)}
  .phead svg.tok{margin-right:-2px}
  .lbdot{display:flex; align-items:center; flex:none}
  .act .ic svg.tok{vertical-align:middle}

  /* roster chips on the setup screen */
  .rosterlbl{font-size:12px; color:var(--ink3); font-weight:700; margin:0 2px 7px}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
  .pchip{display:inline-flex; align-items:center; gap:7px; padding:8px 13px}
  .pchip i{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none}

  /* leaderboard */
  .lbrow{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:12px 13px; margin-bottom:8px; box-shadow:var(--shadow)}
  .lbrow:active{background:var(--card2)}
  .lbrank{font-size:13px; font-weight:800; color:var(--ink3); width:16px; flex:none}
  .lbdot{width:11px; height:11px; border-radius:50%; flex:none}
  .lbname{flex:1; min-width:0; font-weight:800; font-size:15px}
  .lbname small{display:block; font-size:11.5px; font-weight:600; color:var(--ink3); margin-top:3px}
  .lbwins{flex:none; text-align:right; font-weight:900; font-size:19px; min-width:74px}
  .lbwins small{display:block; font-size:10.5px; font-weight:700; color:var(--ink3)}
  .lbbar{display:block; height:4px; border-radius:2px; background:var(--line); margin-top:5px; overflow:hidden}
  .lbbar i{display:block; height:100%; background:var(--sky-btn)}

  /* ================= Game View (TV dashboard) ================= */
  body.tvmode{overflow:hidden}
  body.tvmode #app{max-width:none}
  .tvsignin{height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:6px; text-align:center}
  .tvsignin .logo{font-size:52px}
  .tvsignin h1{font-size:34px; font-weight:900}
  .tvsignin p{color:var(--ink2); font-size:16px}

  .tv{height:100vh; display:grid; gap:.9vh 1vw; padding:1.2vh 1.1vw;
    grid-template-columns:1.8fr 1fr;
    grid-template-rows:auto minmax(0,1fr) minmax(0,.55fr);
    grid-template-areas:"hdr hdr" "players side" "chart side";}
  .tvhdr{grid-area:hdr; display:flex; align-items:baseline; gap:1.6vw; padding:0 .3vw .4vh}
  .tvtitle{font-size:2.5vh; font-weight:900; letter-spacing:.3px; display:flex; align-items:baseline; gap:.8vw}
  .tvtitle small{font-size:1.7vh; font-weight:700; color:var(--ink2)}
  .tvmeta{margin-left:auto; display:flex; gap:1.5vw; font-size:1.6vh; color:var(--ink2)}
  .tvmeta b{color:var(--ink); font-weight:800}
  .tvlive{display:inline-flex; align-items:center; gap:.5vw; color:var(--sky-ink); font-weight:800}
  .tvlive i{width:.9vh; height:.9vh; border-radius:50%; background:var(--sky-btn);
    animation:pulse 2s ease-in-out infinite}
  .tvlive.err{color:var(--indigo-ink)} .tvlive.err i{background:var(--indigo)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .tvplayers{grid-area:players; display:grid; gap:1vh .8vw; min-height:0;
    grid-template-columns:repeat(auto-fit,minmax(19vw,1fr));
    grid-auto-rows:minmax(25vh,max-content); align-content:start; overflow:hidden}
  .tvcard{position:relative; background:var(--card); border:1px solid var(--line-soft);
    border-radius:1.4vh; padding:1.6vh 1.1vw 1.2vh; overflow:hidden; min-height:0;
    box-shadow:var(--shadow); display:flex; flex-direction:column}
  .tvcard .stripe{position:absolute; top:0; left:0; right:0; height:.7vh}
  .tvcard.lead{border-color:var(--sky); background:var(--sky-tint)}
  .tvcard.out{opacity:.42}
  .tvtop{display:flex; align-items:center; gap:.7vw; margin-top:.5vh}
  .tvname{font-size:2.9vh; font-weight:900; flex:1; min-width:0; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .crown{font-size:1.4vh; font-weight:800; color:var(--sky-ink); background:#D5EEFB;
    padding:.3vh .8vh; border-radius:.7vh; vertical-align:middle}
  .tvcash{font-size:3.4vh; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .tvcash.neg{color:var(--brand-ink)}
  .tvstats{display:flex; flex-wrap:wrap; gap:.5vh 1.1vw; margin:1vh 0 1.1vh;
    font-size:1.8vh; color:var(--ink3)}
  .tvstats b{color:var(--ink2); font-weight:800}
  .tvstats .odds b{color:var(--sky-ink)}
  .tvprops{display:flex; flex-wrap:wrap; gap:.6vh; flex:1; align-content:flex-start}
  .tvprops .grp{display:inline-flex; gap:3px; padding:3px; border-radius:.9vh; align-self:flex-start;
    background:color-mix(in srgb, var(--gc) 18%, #fff); border:1px solid var(--line-soft)}
  .tvprops .grp.full{border-color:var(--gc)}
  .tvprops .pc{font-size:1.55vh; font-weight:700; background:var(--gc);
    padding:.4vh .7vh; border-radius:.6vh;
    display:inline-flex; align-items:center; gap:.4vh; white-space:nowrap}
  .tvprops .pc.mort{opacity:.35; text-decoration:line-through}
  .tvprops .pc i{font-style:normal; font-weight:900; background:rgba(31,35,56,.5); color:#fff;
    border-radius:.4vh; padding:0 .35vh}
  .tvempty{font-size:1.7vh; color:var(--ink3)}

  .tvpanel{background:var(--card); border:1px solid var(--line-soft); border-radius:1.2vh;
    padding:1vh 1vw; display:flex; flex-direction:column; min-height:0; box-shadow:var(--shadow)}
  .tvpanel h3{font-size:1.5vh; font-weight:800; letter-spacing:.9px; text-transform:uppercase;
    color:var(--ink3); display:flex; align-items:baseline; gap:.7vw; margin-bottom:.8vh; flex:none}
  .tvpanel h3 small{font-size:1.3vh; letter-spacing:0; text-transform:none; color:var(--ink3); font-weight:600}
  .tvside{grid-area:side; display:flex; flex-direction:column; gap:.9vh; min-height:0}
  .tvside .tvpred{flex:none; min-height:0}
  .tvside .tvlog{flex:1; min-height:0}
  .predlist{display:flex; flex-direction:column; gap:0; overflow:hidden; min-height:0}
  .predrow{display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:
    "tok name pct" "why why why" "bar bar bar" "fac fac fac"; align-items:center; gap:.15vh .6vw;
    padding:.7vh .6vw; margin:0 -.6vw; background:transparent; border:0;
    border-bottom:1px solid var(--line-soft); border-radius:0}
  .predrow:last-child{border-bottom:0}
  .predrow.lead{background:var(--sky-tint); border-radius:.8vh}
  .predrow.out{opacity:.45; grid-template-areas:"tok name pct" "why why why"}
  .predrow svg.tok{grid-area:tok}
  .predrow .pname{grid-area:name; font-size:1.8vh; font-weight:800}
  .predrow .why{grid-area:why; justify-self:start; font-size:1.35vh; color:var(--ink2);
    white-space:normal; margin:0 0 .3vh}
  .predrow .pct{grid-area:pct; font-size:2.2vh; font-weight:900; font-variant-numeric:tabular-nums}
  .predrow .pbar{grid-area:bar; height:.8vh; border-radius:.4vh; background:var(--line); overflow:hidden}
  .predrow .pbar i{display:block; height:100%; border-radius:.4vh}
  .predrow .factors{grid-area:fac; display:flex; gap:.4vw; margin-top:.35vh}
  .fackey{padding:0 0 .7vh; flex:none}
  .fackey .kt{font-size:1.25vh; font-weight:600; color:var(--ink3); line-height:1.35; margin-bottom:.45vh}
  .fackey .kcols{display:flex; gap:.4vw}
  .fackey .kcols span{flex:1; min-width:0; font-size:1.2vh; font-weight:800; color:var(--ink2);
    text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fackey .kcols i{font-style:normal; font-weight:700; color:var(--ink3)}
  .fcell{flex:1; min-width:0}
  .fcell .fnum{display:block; font-style:normal; font-size:1.15vh; font-weight:800;
    color:var(--ink3); line-height:1; margin-bottom:.25vh; font-variant-numeric:tabular-nums}
  .fbar{display:block; height:.6vh; border-radius:.3vh; background:var(--line); overflow:hidden}
  .fbar i{display:block; height:100%; opacity:.85}

  .logscroll{overflow:hidden; display:flex; flex-direction:column; gap:.35vh; min-height:0;
    -webkit-mask-image:linear-gradient(to bottom, #000 88%, transparent 100%);
    mask-image:linear-gradient(to bottom, #000 88%, transparent 100%)}
  .tvlogrow{display:flex; gap:.7vw; font-size:1.55vh; line-height:1.35;
    padding:.35vh 0; border-bottom:1px solid var(--line-soft)}
  .tvlogrow .lt{color:var(--ink3); font-size:1.25vh; flex:none; width:4.6vw;
    font-variant-numeric:tabular-nums; padding-top:.2vh}
  .tvlogrow .lx{flex:1}

  .tvchart{grid-area:chart}
  .chartlegend{display:flex; flex-wrap:wrap; gap:.4vh 1vw; margin-bottom:.5vh; flex:none}
  .lgd{display:inline-flex; align-items:center; gap:.4vw; font-size:1.35vh; color:var(--ink2); font-weight:700}
  .lgd i{width:1.1vh; height:1.1vh; border-radius:.3vh; display:inline-block}
  .chartbox{position:relative; flex:1; min-height:0}
  .chartbox svg{display:block}
  .chartbox .gl{stroke:var(--line-soft); stroke-width:1}
  .chartbox .ax-line{stroke:var(--line); stroke-width:1}
  .chartbox .ax{fill:var(--ink3); font-size:11px; font-weight:600}
  .chartbox .sep{fill:none; stroke:var(--card); stroke-width:2}
  .chartbox .dl{fill:var(--ink2); font-size:12px; font-weight:700}
  .chartbox .dlv{font-size:13px; font-weight:900}
  .chartbox .cross{stroke:var(--ink3); stroke-width:1; stroke-opacity:.8}
  .charttip{position:absolute; top:4px; background:var(--card); box-shadow:var(--shadow-lg); border:1px solid var(--line);
    border-radius:.8vh; padding:.6vh .8vh; font-size:1.3vh; pointer-events:none; min-width:9vw}
  .charttip .tt{color:var(--ink3); font-weight:700; margin-bottom:.3vh}
  .charttip div{display:flex; align-items:center; gap:.4vw; white-space:nowrap}
  .charttip i{width:1vh; height:1vh; border-radius:.25vh; display:inline-block}
  .charttip b{margin-left:auto; font-variant-numeric:tabular-nums}

  /* stat tiles */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:4px 0 6px}
  @media (min-width:460px){ .tiles{grid-template-columns:1fr 1fr 1fr} }
  .tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px}
  .tile .tv{font-size:19px; font-weight:900; font-variant-numeric:tabular-nums}
  .tile .tl{font-size:11px; font-weight:700; color:var(--ink3); margin-top:2px}

  /* ---------- setup ---------- */
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:6px}
  .field input[type=text],.field input[type=number],.field input[type=password]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg2); color:var(--ink); font-size:16px}
  .field input:focus{outline:2px solid var(--sky-btn)}
  .prow{display:flex; gap:10px; align-items:center; margin-bottom:10px}
  .prow input{flex:1}
  .swatch{width:46px; height:46px; border-radius:12px; border:3px solid transparent; flex:none}
  .swatch.sel{border-color:#fff}
  .prow .rm{color:var(--ink3); font-size:18px; padding:6px}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px}
  .toggle .tl{font-size:14.5px; font-weight:700}
  .toggle .td{font-size:12px; color:var(--ink3); margin-top:2px}
  .switch{width:50px; height:30px; border-radius:15px; background:var(--line); position:relative; flex:none; transition:background .15s}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:var(--ink); transition:left .15s}
  .switch.on{background:var(--sky-btn)}
  .switch.on::after{left:23px}

  /* ---------- game: player cards ---------- */
  .bankbar{display:flex; gap:10px; margin:2px 0 12px}
  .bankcard{flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 13px; text-align:left}
  .bankcard:active{background:var(--card2)}
  .bankcard .bl{font-size:11px; font-weight:800; letter-spacing:.8px; color:var(--ink3); text-transform:uppercase}
  .bankcard .bv{font-size:17px; font-weight:800; margin-top:3px}
  .pgrid{display:grid; grid-template-columns:1fr; gap:10px}
  @media (min-width:520px){ .pgrid{grid-template-columns:1fr 1fr} }
  @media (min-width:820px){ .pgrid{grid-template-columns:1fr 1fr 1fr} }
  .pcard{position:relative; background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius);
    padding:13px 12px 12px; text-align:left; overflow:hidden; box-shadow:var(--shadow)}
  .pcard .stripe{position:absolute; top:0; left:0; right:0; height:5px}
  .phead{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:2px 2px 0}
  .phead:active{opacity:.7}
  .phead .pn{font-weight:800; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
  .phead .pb{font-size:22px; font-weight:900; font-variant-numeric:tabular-nums; flex:none}
  .phead .pb.neg{color:var(--brand-ink)}
  .phead .more{flex:none; color:var(--ink3); font-size:16px; padding:0 2px}
  .pcard .pm{margin-top:6px; display:flex; gap:4px; flex-wrap:wrap; min-height:10px; padding:0 2px}
  .pcard .dot{width:9px; height:9px; border-radius:3px; border:1px solid rgba(31,35,56,.25)}
  .pcard .dot.mort{opacity:.3}
  /* ---------- paused ---------- */
  .pausebn{display:flex; align-items:center; gap:10px; margin:0 0 12px; padding:12px 14px;
    background:var(--brand-tint); border:1px solid var(--brand); border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .pausebn .pi{font-size:22px; line-height:1; flex:none}
  .pausebn .px{flex:1; min-width:0}
  .pausebn .pt{display:block; font-size:14.5px; font-weight:900; color:var(--brand-ink)}
  .pausebn .ps{display:block; font-size:12px; font-weight:600; color:var(--ink2); margin-top:2px}

/* Board colours run from #fef200 to #0072bb — pick ink or white per swatch
   so a chip is always readable, whatever set it belongs to. */
function inkOn(hex){
  const c = hex.replace("#","");
  const [r,g,b] = [0,2,4].map(i=>parseInt(c.slice(i,i+2),16)/255)
    .map(v=>v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
  const L = 0.2126*r + 0.7152*g + 0.0722*b;
  return (L + 0.05) / 0.05 >= 4.5 ? "#1F2338" : "#FFFFFF";   // vs white text
}
function tokenSVG(id, color, size){
  return `<svg class="tok" width="${size}" height="${size}" viewBox="0 0 24 24" `
    + `fill="${color||"currentColor"}" aria-hidden="true">${TOKEN(id).svg}</svg>`;
}
/* Categorical palette, fixed order — validated for the dark surface:

const RAIL_RENT = [0,25,50,100,200];
const TOTAL_HOUSES = 32, TOTAL_HOTELS = 12;

/* ---------------- App state ---------------- */

const fmt = n => "$" + Math.abs(Math.round(n)).toLocaleString("en-US");

const newStats = () => ({
  rentCollected:0, rentPaid:0, taxesPaid:0, goCollected:0,
  bankReceived:0, bankPaid:0, freeParkingWon:0,
  paidToPlayers:0, receivedFromPlayers:0,

  housesBuilt:0, hotelsBuilt:0, timesMortgaged:0,
  mortgageProceeds:0, unmortgageCost:0,

function newGameState(name, players, opts){

    settings: { startingCash: opts.startingCash, goAmount: opts.goAmount, freeParking: opts.freeParking },
    players: players.map((p,i)=>({ id:"p"+(i+1)+"_"+Math.random().toString(36).slice(2,7),

      balance:opts.startingCash, bankrupt:false, pos:null, inJail:false, stats:newStats() })),
    props: {},           // propId -> {owner, mortgaged, houses}

/* Older saved games predate the stats tallies — backfill on load. */
function migrateState(st){
  if (!st) return st;
  if (!Array.isArray(st.probTimeline)) st.probTimeline = [];
  st.players.forEach((p,i)=>{
    p.stats = Object.assign(newStats(), p.stats||{});
    if (!p.token) p.token = TOKENS[i%TOKENS.length].id;   // games from before pieces existed
  });
  if (st.endedAt === undefined) st.endedAt = null;
  if (st.paused === undefined){ st.paused = false; st.pausedAt = null; }
  if (st.turn === undefined) st.turn = null;
  st.players.forEach(p=>{
    if (p.pos === undefined) p.pos = null;      // games from before positions were tracked
    if (p.inJail === undefined) p.inJail = false;
  });
  st.v = 2;
  return st;
}
/* Add to a player's running tally. */
function bump(plId, key, amount){
  const p = (plId && plId!=="BANK" && plId!=="FP") ? player(plId) : null;
  if (!p) return;
  if (!p.stats) p.stats = newStats();
  if (key==="biggestRentPaid" || key==="biggestRentCollected")
    p.stats[key] = Math.max(p.stats[key]||0, amount);
  else p.stats[key] = (p.stats[key]||0) + amount;
}
const player = id => S.players.find(p=>p.id===id);
const propState = pid => S.props[pid] || null;
const ownerOf = pid => { const st=S.props[pid]; return st && st.owner ? player(st.owner) : null; };
const playerProps = plId => BOARD.filter(p=> S.props[p.id] && S.props[p.id].owner===plId);
function ownsFullGroup(plId, group){
  return GROUP_MEMBERS[group].every(pid => S.props[pid] && S.props[pid].owner===plId);
}
function groupHasMortgage(group){
  return GROUP_MEMBERS[group].some(pid => S.props[pid] && S.props[pid].mortgaged);
}
function housesInUse(){
  let h=0, ho=0;
  for (const pid in S.props){ const n=S.props[pid].houses||0; if(n===5) ho++; else h+=n; }
  return {houses:h, hotels:ho};
}
function rentFor(pid, diceRoll){
  const p = PROP[pid], st = S.props[pid];
  if (!st || !st.owner || st.mortgaged) return 0;
  if (p.group==="rail"){
    const n = GROUP_MEMBERS.rail.filter(id=>S.props[id] && S.props[id].owner===st.owner && !S.props[id].mortgaged).length;
    return RAIL_RENT[n];
  }
  if (p.group==="util"){
    const both = GROUP_MEMBERS.util.every(id=>S.props[id] && S.props[id].owner===st.owner);
    return (diceRoll||7) * (both?10:4);
  }
  const h = st.houses||0;
  if (h===0 && ownsFullGroup(st.owner, p.group) && !groupHasMortgage(p.group)) return p.rent[0]*2;
  return p.rent[h];
}
function netWorth(pl){
  let w = Number(pl.balance) || 0;
  for (const p of playerProps(pl.id)){
    const st = S.props[p.id];
    w += st.mortgaged ? 0 : (p.price||0)/2;          // mortgage value still extractable
    if (st.houses && p.house) w += (st.houses===5?5:st.houses) * (p.house/2);
  }
  return Math.round(w);
}

/* ---------------- Win predictor ----------------
   A transparent heuristic, not a simulation. Four factors, each scored as a
   share of the table, then sharpened as the board fills up so the odds go from
   near-even at the start to decisive once monopolies are developed. */
const PRED_WEIGHTS = { netWorth:0.35, monopolies:0.30, development:0.20, cash:0.15 };
const GROUP_CLOUT = {           // rough earning power of a full set
  brown:0.45, ltblue:0.6, pink:0.8, orange:1.0, red:1.05, yellow:1.1, green:1.2, dkblue:1.25
};
function predict(){
  const alive = S.players.filter(p=>!p.bankrupt);
  const out = { probs:{}, factors:{}, leader:null, decisive:0 };
  if (!alive.length) return out;
  if (alive.length === 1){
    out.probs[alive[0].id] = 1; out.leader = alive[0].id;
    out.factors[alive[0].id] = { netWorth:1, monopolies:1, development:1, cash:1 };
    return out;
  }
  const raw = alive.map(p=>{
    const owned = playerProps(p.id);
    let houses = 0, hotels = 0, clout = 0;
    owned.forEach(pr=>{
      const st = S.props[pr.id];
      if (st.houses === 5) hotels++; else houses += st.houses || 0;
    });
    Object.keys(GROUP_CLOUT).forEach(g=>{
      if (ownsFullGroup(p.id, g) && !groupHasMortgage(g)) clout += GROUP_CLOUT[g];
    });
    // railroads and utilities add steady, lower-grade income
    const rails = GROUP_MEMBERS.rail.filter(id=>S.props[id] && S.props[id].owner===p.id).length;
    const utils = GROUP_MEMBERS.util.filter(id=>S.props[id] && S.props[id].owner===p.id).length;
    clout += rails * 0.16 + utils * 0.08;
    return { id:p.id, netWorth:Math.max(0, netWorth(p)), clout,
             development: houses + hotels * 2.2, cash:Math.max(0, p.balance) };
  });
  const share = (key) => {
    const total = raw.reduce((a,r)=>a + r[key], 0);
    return r => total > 0 ? r[key]/total : 1/raw.length;
  };
  const nwShare = share("netWorth"), clShare = share("clout"),
        devShare = share("development"), cashShare = share("cash");
  const scored = raw.map(r=>{
    const f = { netWorth:nwShare(r), monopolies:clShare(r),
                development:devShare(r), cash:cashShare(r) };
    out.factors[r.id] = f;
    const score = f.netWorth*PRED_WEIGHTS.netWorth + f.monopolies*PRED_WEIGHTS.monopolies
                + f.development*PRED_WEIGHTS.development + f.cash*PRED_WEIGHTS.cash;
    return { id:r.id, score:Math.max(score, 1e-4) };
  });
  // how far along the game is → how confident the odds get
  const ownedCount = Object.keys(S.props).filter(k=>S.props[k].owner).length;
  const anyMonopoly = raw.some(r=>r.clout >= 0.4);
  const progress = Math.min(1, ownedCount/BOARD.length * (anyMonopoly ? 1.25 : 0.75));
  const K = 1.4 + 2.6 * progress;
  out.decisive = progress;
  const pow = scored.map(x=>({ id:x.id, v:Math.pow(x.score, K) }));
  const sum = pow.reduce((a,x)=>a + x.v, 0) || 1;
  pow.forEach(x=>{ out.probs[x.id] = x.v/sum; });
  S.players.forEach(p=>{ if (p.bankrupt) out.probs[p.id] = 0; });
  out.leader = pow.slice().sort((a,b)=>b.v-a.v)[0].id;
  return out;
}
/* One-line explanation of why someone sits where they do. */
function predictWhy(plId, f){
  if (!f) return "";
  const pl = player(plId);
  if (pl.bankrupt) return "out of the game";
  const bits = [];
  const mono = Object.keys(GROUP_CLOUT).filter(g=>ownsFullGroup(plId,g)).length;
  if (mono >= 2) bits.push(mono+" monopolies");
  else if (mono === 1) bits.push("a monopoly");
  const owned = playerProps(plId);
  let built = 0; owned.forEach(pr=>{ built += S.props[pr.id].houses||0; });
  if (built >= 6) bits.push("heavily developed");
  else if (built > 0) bits.push("building up");
  if (!bits.length && owned.length) bits.push(owned.length+" properties");
  if (!owned.length) bits.push("no property yet");
  const cashRank = S.players.filter(x=>!x.bankrupt).sort((a,b)=>b.balance-a.balance);
  if (cashRank.length > 1 && cashRank[0].id === plId) bits.push("most cash");
  else if (f.cash < 0.12) bits.push("thin on cash");
  const mortgaged = owned.filter(pr=>S.props[pr.id].mortgaged).length;
  if (mortgaged >= 2) bits.push(mortgaged+" mortgaged");
  return bits.slice(0,3).join(", ");
}

/* ---------------- Mutations (all go through mutate()) ---------------- */
function pushSnapshot(){
  snapshots.push(JSON.stringify(S));
  if (snapshots.length>60) snapshots.shift();
}
function logLine(text){
  S.log.unshift({ t: Date.now(), x: text });
  if (S.log.length>400) S.log.length = 400;
}
/* opts.whilePaused marks an action that touches no money and no property, so
   the pause lock (which exists to stop accidental transactions) shouldn't
   swallow it — renaming the game is the case that bit us. */
function mutate(fn, logText, opts){
  if (S && S.paused && !(opts && opts.whilePaused)){
    toast("Game is paused — hit Resume"); return;
  }
  pushSnapshot();
  fn();
  if (logText) logLine(logText);
  sampleProbabilities();   // keeps the Game View timeline dense
  renderGame();
  scheduleSave();
}
/* Win-probability timeline. Stored as {t, p:[…]} aligned to S.players order so
   the Game View dashboard can draw the whole arc of the game. */
function sampleProbabilities(){
  if (!S) return;
  if (!Array.isArray(S.probTimeline)) S.probTimeline = [];
  const probs = predict().probs;
  const row = S.players.map(p=>Math.round((probs[p.id]||0)*1000)/1000);
  const last = S.probTimeline[S.probTimeline.length-1];
  const moved = !last || last.p.length !== row.length
    || row.some((v,i)=>Math.abs(v - last.p[i]) >= 0.015);
  const stale = last && (Date.now() - last.t) > 90000;
  if (!last || moved || stale){
    S.probTimeline.push({ t: Date.now(), p: row });
    if (S.probTimeline.length > 600) S.probTimeline.splice(0, S.probTimeline.length - 600);
  }
}

function undo(){
  if (S && S.paused){ toast("Game is paused — hit Resume"); return; }
  if (!snapshots.length){ toast("Nothing to undo"); return; }
  const last = S.log[0];
  S = JSON.parse(snapshots.pop());
  renderGame();
  scheduleSave();
  toast("Undone" + (last? ": " + last.x.slice(0,40) : ""));
}
/* Pause locks every money action. It deliberately sits outside mutate()/undo so
   a pause can never be rewound away, leaving the table locked with no way back. */
function togglePause(){
  if (!S) return;
  S.paused = !S.paused;
  S.pausedAt = S.paused ? Date.now() : null;
  // Turn and position belong to the break, not the game. Once play resumes they
  // go stale on the first roll, so they are cleared rather than left to mislead
  // at the next pause.
  if (!S.paused){
    S.turn = null;
    S.players.forEach(pl=>{ pl.pos = null; pl.inJail = false; });
  }
  logLine(S.paused ? "⏸ Game paused" : "▶️ Game resumed");
  renderGame();
  scheduleSave();
  toast(S.paused ? "Paused — the cards are locked" : "Resumed");
}
/* Turn and position are recorded WHILE paused, so they can't go through

          if (st.houses===5) bits.push("1 Hotel");
          else if (st.houses>0) bits.push(st.houses + (st.houses===1? " House" : " Houses"));
          if (st.mortgaged) bits.push("Mortgaged");
          return `<div class="tdli"><i class="sw" style="background:${c}"></i><span class="nm">${esc(pr.name)}${
            bits.length? ` \u2014 <b>${bits.join(" \u00b7 ")}</b>` : ""}</span></div>`;
        }).join("")}</div>` : `<div class="tdnone">no properties</div>`}
      </div>`;
    }).join("")}
  </div>`;
}
function nameOf(id){
  if (id==="BANK") return "the Bank";
  if (id==="FP") return "Free Parking";
  const p = player(id); return p ? p.name : "?";
}
function transfer(from, to, amount, why, cat){
  amount = Math.round(amount);
  if (!amount) return;
  mutate(()=>{
    if (from!=="BANK" && from!=="FP") player(from).balance -= amount;
    if (from==="FP") S.freeParking -= amount;
    if (to!=="BANK" && to!=="FP") player(to).balance += amount;
    if (to==="FP") S.freeParking += amount;
    switch (cat){
      case "rent":
        bump(from,"rentPaid",amount); bump(from,"biggestRentPaid",amount);
        bump(to,"rentCollected",amount); bump(to,"biggestRentCollected",amount);
        break;
      case "tax":    bump(from,"taxesPaid",amount); break;
      case "go":     bump(to,"goCollected",amount); break;
      case "fp":     bump(to,"freeParkingWon",amount); break;
      case "bankIn": bump(to,"bankReceived",amount); break;
      case "bankOut":bump(from,"bankPaid",amount); break;
      case "player":
        bump(from,"paidToPlayers",amount); bump(to,"receivedFromPlayers",amount);
        break;
    }
  }, `${nameOf(from)} paid ${fmt(amount)} to ${nameOf(to)}` + (why? ` — ${why}` : ""));
}

/* ---------------- Standings (what gets written to the stats table) ---------------- */
function monopoliesOf(plId){
  return Object.keys(GROUPS).filter(g => g!=="rail" && g!=="util" && ownsFullGroup(plId,g)).length;
}
function computeStandings(){
  const alive = S.players.filter(p=>!p.bankrupt);
  const winner = (S.finished || alive.length===1) && alive.length===1 ? alive[0].id : null;
  const rows = S.players.map(p=>{
    const owned = playerProps(p.id);
    let houses=0, hotels=0, mortgaged=0;
    owned.forEach(pr=>{
      const st=S.props[pr.id];
      if (st.houses===5) hotels++; else houses += st.houses||0;
      if (st.mortgaged) mortgaged++;
    });
    const st = Object.assign(newStats(), p.stats||{});
    return Object.assign({
      name:p.name, color:p.color, token:p.token || TOKENS[0].id,
      bankrupt:!!p.bankrupt, won: p.id===winner,
      cash:Math.round(p.balance), netWorth:Math.round(netWorth(p)),
      props:owned.length, monopolies:monopoliesOf(p.id),
      houses, hotels, mortgaged,
    }, st);
  });
  // rank: survivors by net worth, bankrupt players last
  rows.slice().sort((a,b)=>{
    if (a.bankrupt !== b.bankrupt) return a.bankrupt ? 1 : -1;
    return b.netWorth - a.netWorth;
  }).forEach((r,i)=>{ r.rank = i+1; });
  return rows;
}
function gameMeta(){
  const ended = S.finished ? (S.endedAt || Date.now()) : null;
  return {
    finished: !!S.finished,
    playerCount: S.players.length,
    startingCash: S.settings.startingCash,
    goAmount: S.settings.goAmount,
    freeParking: !!S.settings.freeParking,
    startedAt: S.createdAt,
    endedAt: ended,
    durationSeconds: Math.round((((ended || Date.now()) - S.createdAt))/1000),
  };
}

/* ---------------- Supabase (plain REST, no SDK needed) ---------------- */
const hasCreds = () => !!(creds.url && creds.key);
function sbUrl(path){ return creds.url.replace(/\/+$/,"") + path; }

/* ---------------- Auth (Google sign-in via Supabase Auth) ---------------- */
let session = null; // {access_token, refresh_token, expires_at, user:{id,email,name,avatar}}
try { const s = localStorage.getItem("mb_session"); if (s) session = JSON.parse(s); } catch(e) {}
function persistSession(){
  try { session ? localStorage.setItem("mb_session", JSON.stringify(session))
                : localStorage.removeItem("mb_session"); } catch(e) {}
}
function decodeUser(jwt){
  try {
    const p = JSON.parse(atob(jwt.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    const m = p.user_metadata || {};
    return { id:p.sub, email:p.email||"", name:m.full_name||m.name||p.email||"Player", avatar:m.avatar_url||m.picture||"" };
  } catch(e){ return { id:"", email:"", name:"Player", avatar:"" }; }
}
function adoptTokens(j){
  session = {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Date.now() + ((+j.expires_in || 3600) - 60) * 1000,
    user: decodeUser(j.access_token),
  };
  persistSession();
}
function parseHashSession(){
  if (!location.hash || !location.hash.includes("access_token")) return false;
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.get("access_token")) return false;
  adoptTokens({ access_token:p.get("access_token"), refresh_token:p.get("refresh_token"),
    expires_in:p.get("expires_in") });
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}
function signIn(){
  if (!hasCreds()) return openSettings();
  const redirect = location.origin + location.pathname;
  location.href = sbUrl("/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(redirect));
}
async function signOut(){
  try {
    if (session) await fetch(sbUrl("/auth/v1/logout"), { method:"POST",
      headers:{ apikey:creds.key, "Authorization":"Bearer "+session.access_token } });
  } catch(e) {}
  session = null; persistSession();
  renderHome();
}
async function ensureFreshSession(){
  if (!session) return false;
  if (Date.now() < session.expires_at) return true;
  try {
    const r = await fetch(sbUrl("/auth/v1/token?grant_type=refresh_token"), {
      method:"POST",
      headers:{ apikey:creds.key, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!r.ok) throw new Error("refresh failed");
    adoptTokens(await r.json());
    return true;
  } catch(e){
    session = null; persistSession();
    return false;
  }
}
const canSave = () => hasCreds() && !!session;

async function sb(path, opts={}){
  if (session) await ensureFreshSession();
  const auth = session ? { "Authorization": "Bearer " + session.access_token }
    // Legacy anon keys are JWTs and may go in the Authorization header;
    // new sb_publishable_* keys must NOT be sent as a Bearer token.
    : (creds.key.startsWith("eyJ") ? { "Authorization": "Bearer " + creds.key } : {});
  const res = await fetch(sbUrl(path), {
    ...opts,
    headers: {
      "apikey": creds.key,
      ...auth,
      "Content-Type": "application/json",
      ...(opts.headers||{}),
    },
  });
  if (!res.ok){ const txt = await res.text().catch(()=> ""); throw new Error("Supabase " + res.status + ": " + txt.slice(0,180)); }
  const ct = res.headers.get("content-type")||"";
  return ct.includes("json") ? res.json() : null;
}
function setSaveStatus(cls, text){
  const el = $("#savest"); if (!el) return;
  el.className = "savedot " + cls;
  el.innerHTML = "<i></i>" + esc(text);
}
function scheduleSave(){
  if (!S) return;
  if (!canSave()){ setSaveStatus("", hasCreds()? "Not saving — sign in" : "Not saving — set up Supabase"); return; }
  setSaveStatus("busy","Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}
async function saveNow(){
  if (!S || !canSave()) return;
  if (saveBusy){ savePending = true; return; }
  saveBusy = true;
  // Snapshot-as-you-play: the DB trigger reads these two keys and keeps
  // the roster + game_stats table in sync on every save.
  S.standings = computeStandings();
  S.meta = gameMeta();
  sampleProbabilities();
  const stateRef = S;
  try {
    if (!gameId){
      const rows = await sb("/rest/v1/games", { method:"POST",
        headers:{ "Prefer":"return=representation" },
        body: JSON.stringify({ name:stateRef.name, state:stateRef }) });
      if (S === stateRef) gameId = rows[0].id;
    } else {
      await sb("/rest/v1/games?id=eq."+gameId, { method:"PATCH",
        body: JSON.stringify({ name:stateRef.name, state:stateRef }) });
    }
    setSaveStatus("ok","Saved");
  } catch(e){
    console.error(e);
    setSaveStatus("err","Save failed");
  }
  saveBusy = false;
  if (savePending){ savePending=false; saveNow(); }
}
async function fetchGame(id){
  const rows = await sb("/rest/v1/games?id=eq."+encodeURIComponent(id)+"&select=id,name,state,updated_at&limit=1");
  return rows && rows[0];
}
async function fetchRoster(){
  try { return await sb("/rest/v1/players?select=name,color&order=last_played_at.desc&limit=40"); }
  catch(e){ console.error(e); return []; }
}
async function fetchLeaderboard(){
  return sb("/rest/v1/player_leaderboard?select=*&order=wins.desc,games.desc,player_name.asc");
}
async function fetchPlayerGames(name){
  return sb("/rest/v1/game_stats?player_name=eq."+encodeURIComponent(name)
    +"&select=*&order=updated_at.desc&limit=50");
}

}
async function deleteGame(id){
  await sb("/rest/v1/games?id=eq."+id, { method:"DELETE" });
}

/* ---------------- Overlay stack ---------------- */
const ovStack = [];
function openPanel(html, onMount){
  const root = $("#ovroot");
  const w = document.createElement("div");
  w.className = "ovwrap";
  w.innerHTML = `<div class="scrim"></div><div class="panel"><div class="grab"></div>${html}</div>`;
  w.querySelector(".scrim").addEventListener("click", ()=>closePanel(w));
  root.appendChild(w);
  ovStack.push(w);
  if (onMount) onMount(w);
  return w;
}
function closePanel(w){
  const el = w || ovStack[ovStack.length-1];
  if (!el) return;
  const i = ovStack.indexOf(el); if (i>=0) ovStack.splice(i,1);
  el.remove();
}
function closeAllPanels(){ while(ovStack.length) closePanel(); }

function askAmount({title, sub, initial=0, confirmLabel="Confirm", danger=false}, cb){

    </div>
    <button class="confirmbtn ${danger?"red":""}" id="np_ok">${esc(confirmLabel)}</button>
  `, w=>{
    const vEl = w.querySelector("#np_v");
    const paint = ()=>{ vEl.textContent = val.toLocaleString("en-US");
      w.querySelector("#np_ok").disabled = val<=0; };
    paint();

   "$8 of rent". This panel offers the eleven possible two-dice totals and shows

        const d = new Date(r.updated_at);
        const tag = r.won? `<span class="tag gold">won</span>`
          : r.bankrupt? `<span class="tag red">bankrupt</span>`
          : !r.finished? `<span class="tag">in play</span>`
          : `<span class="tag">#${r.rank||"?"}</span>`;
        return `<div class="prop" style="cursor:default">
          <div class="bar" style="background:${esc(r.color||"#888")}"></div>
          <div class="pinfo"><div class="pname">${esc(r.game_name||"Game")} ${tag}</div>
          <div class="psub">${d.toLocaleDateString()} · ${r.props||0} props · ${(r.houses||0)+(r.hotels||0)} built${
            r.duration_seconds? " · "+Math.max(1,Math.round(r.duration_seconds/60))+" min" : ""}</div></div>
          <div class="pright">${fmt(r.net_worth||0)}<small>net worth</small></div>
        </div>`;
      }).join("")}`;
  }).catch(e=>{
    const body = w.querySelector("#ps_body");
    if (body) body.innerHTML = `<div class="note">Couldn’t load stats: ${esc(e.message)}</div>`;
  });
}

/* ----- SETUP ----- */
function renderSetup(){
  closeAllPanels();
  const roster = [ {name:"", color:PLAYER_COLORS[0], token:TOKENS[0].id},
                   {name:"", color:PLAYER_COLORS[1], token:TOKENS[1].id} ];
  let opts = { startingCash:1500, goAmount:200, freeParking:false };
  setApp(`
    <div class="hdr">
      <button class="iconbtn" id="s_back">‹</button>
      <div class="title">New Game</div>
    </div>
    <div class="scroller">

      <div class="sect">Players</div>

        <div class="switch" id="s_fpsw"></div>

      <button class="bigbtn" id="s_start" style="margin-top:16px">Start Game 🎲</button>
      <div style="height:30px"></div>
    </div>
  `);
  const paintPlayers = ()=>{
    $("#s_players").innerHTML = roster.map((p,i)=>`
      <div class="prow">
        <button class="swatch tokbtn" data-pick="${i}" aria-label="Choose playing piece">
          ${tokenSVG(p.token, p.color, 30)}</button>
        <input type="text" placeholder="Player ${i+1}" value="${esc(p.name)}" data-name="${i}" maxlength="20">
        ${roster.length>2? `<button class="rm" data-rm="${i}">✕</button>`:""}
      </div>`).join("");
  };
  paintPlayers();

  // Saved roster — everyone who has played in one of your games before.
  // ("roster" above is the editable form rows; savedRoster is the stored list.)
  let savedRoster = [];
  function paintChips(){
    const box = $("#s_chips"); if (!box) return;
    const taken = new Set(roster.map(r=>r.name.trim().toLowerCase()).filter(Boolean));
    const avail = savedRoster.filter(r=>r.name && !taken.has(r.name.toLowerCase()));
    $("#s_roster").hidden = avail.length===0;
    box.innerHTML = avail.map(r=>
      `<button class="chip pchip" data-add-name="${esc(r.name)}" data-add-color="${esc(r.color||"")}"
        data-add-token="${esc(r.token||"")}">
        ${tokenSVG(r.token, r.color||"var(--ink2)", 17)}${esc(r.name)}</button>`).join("");
  }
  if (hasCreds() && session){
    fetchRoster().then(rows=>{ savedRoster = rows||[]; paintChips(); });
  }
  $("#s_chips").addEventListener("click", e=>{
    const b = e.target.closest("[data-add-name]"); if (!b) return;
    const name = b.dataset.addName, color = b.dataset.addColor;
    // reuse their usual piece unless someone at this table already has it
    const used = roster.map(r=>r.token);
    let tok = b.dataset.addToken;
    if (!tok || used.includes(tok)) tok = (TOKENS.find(t=>!used.includes(t.id))||TOKENS[0]).id;
    const blank = roster.findIndex(r=>!r.name.trim());
    if (blank >= 0){
      roster[blank].name = name;
      if (color) roster[blank].color = color;
      const others = roster.filter((r,j)=>j!==blank).map(r=>r.token);
      roster[blank].token = (b.dataset.addToken && !others.includes(b.dataset.addToken))
        ? b.dataset.addToken : (TOKENS.find(t=>!others.includes(t.id))||TOKENS[0]).id;
    } else {
      if (roster.length>=8) return toast("Max 8 players");
      roster.push({ name, color: color || PLAYER_COLORS[roster.length%PLAYER_COLORS.length], token: tok });
    }
    paintPlayers(); paintChips();
  });

  function openPiecePicker(i){
    const me = roster[i];
    const taken = roster.filter((r,j)=>j!==i).map(r=>r.token);
    const w = openPanel(`
      <h2>Playing piece</h2>
      <div class="sub">${esc(me.name.trim() || "Player "+(i+1))}</div>
      <div class="pscroll">
        <div class="tokgrid">
          ${TOKENS.map(t=>`
            <button class="tokopt ${t.id===me.token?"sel":""}" data-tok="${t.id}"
              ${taken.includes(t.id)?"disabled":""} title="${esc(t.name)}">
              ${tokenSVG(t.id, t.id===me.token? me.color : "var(--ink2)", 34)}
              <span>${esc(t.name)}</span>
            </button>`).join("")}
        </div>
        <div class="grouphdr">Colour</div>
        <div class="chips">
          ${PLAYER_COLORS.map(c=>`<button class="colopt ${c===me.color?"sel":""}"
            data-col="${c}" style="background:${c}" aria-label="colour"></button>`).join("")}
        </div>
      </div>
    `);
    w.querySelector(".pscroll").addEventListener("click", e=>{
      const t = e.target.closest("[data-tok]");
      if (t && !t.disabled){ me.token = t.dataset.tok; closePanel(w); paintPlayers(); paintChips(); return; }
      const c = e.target.closest("[data-col]");
      if (c){ me.color = c.dataset.col; closePanel(w); paintPlayers(); paintChips(); }
    });
  }

  $("#s_back").addEventListener("click", renderHome);
  $("#s_add").addEventListener("click", ()=>{
    if (roster.length>=8) return toast("Max 8 players");
    const used = roster.map(r=>r.token);
    const free = TOKENS.find(t=>!used.includes(t.id)) || TOKENS[roster.length%TOKENS.length];
    roster.push({name:"", color:PLAYER_COLORS[roster.length%PLAYER_COLORS.length], token:free.id});
    paintPlayers(); paintChips();
  });
  $("#s_players").addEventListener("input", e=>{
    if (e.target.dataset.name!==undefined){
      roster[+e.target.dataset.name].name = e.target.value;
      paintChips();
    }
  });
  $("#s_players").addEventListener("click", e=>{
    const c = e.target.closest("[data-pick]");
    if (c) openPiecePicker(+c.dataset.pick);
    const rm = e.target.closest("[data-rm]");
    if (rm){ roster.splice(+rm.dataset.rm,1); paintPlayers(); paintChips(); }
  });
  $("#s_fp").addEventListener("click", ()=>{
    opts.freeParking = !opts.freeParking;
    $("#s_fpsw").classList.toggle("on", opts.freeParking);
  });
  $("#s_start").addEventListener("click", ()=>{
    const names = roster.map((p,i)=> p.name.trim() || ("Player "+(i+1)));
    opts.startingCash = Math.max(0, +$("#s_cash").value || 1500);
    opts.goAmount = Math.max(0, +$("#s_go").value || 200);
    const name = $("#s_name").value.trim() || ("Game — " + new Date().toLocaleDateString());
    S = newGameState(name, roster.map((p,i)=>({name:names[i], color:p.color, token:p.token})), opts);
    gameId = null; snapshots = [];
    logLine("Game started — " + names.join(", ") + ` (${fmt(opts.startingCash)} each)`);
    renderGame();
    scheduleSave();
  });
}

/* one-tap actions shared by the cards and the player sheet */
function quickAction(plId, a){
  const pl = player(plId);
  if (pl.bankrupt){ toast(pl.name+" is bankrupt"); return; }
  if (a==="go"){ transfer("BANK", plId, S.settings.goAmount, "passed GO", "go"); toast(pl.name+" +"+fmt(S.settings.goAmount)); }
  else if (a==="collect"){ askAmount({title:"Collect from Bank", sub:pl.name+" receives"}, v=>transfer("BANK", plId, v, "", "bankIn")); }
  else if (a==="paybank"){ openPayBank(plId); }
  else if (a==="payplayer"){ pickPlayer("Who does "+pl.name+" pay?", plId, toId=>{
    askAmount({title:pl.name+" pays "+player(toId).name}, v=>transfer(plId, toId, v, "", "player"));
  }); }
  else if (a==="payrent"){ openPayRent(plId); }
  else if (a==="buy"){ openBuyProperty(plId); }
  else if (a==="manage"){ openManageProps(plId); }
  else if (a==="bankrupt"){ openBankruptcy(plId); }
}

/* ----- rent ----- */
function openPayRent(plId){
  const pl = player(plId);
  const rentable = BOARD.filter(p=>{
    const st=S.props[p.id];
    return st && st.owner && st.owner!==plId && !player(st.owner).bankrupt;
  });
  if (!rentable.length){ toast("No one else owns property yet"); return; }
  openPropList({
    title: pl.name+" pays rent on…",
    props: rentable,
    detail: p=>{
      const st=S.props[p.id]; const ow=player(st.owner);
      if (st.mortgaged) return {right:"no rent", sub:ow.name+" · mortgaged", disabled:true};
      return {right: p.group==="util"? "dice total ×"+(GROUP_MEMBERS.util.every(id=>S.props[id]&&S.props[id].owner===st.owner)?10:4) : fmt(rentFor(p.id)),
        sub:"owned by "+ow.name + (st.houses? (st.houses===5?" · hotel":" · "+st.houses+" house"+(st.houses>1?"s":"")) : "")};
    },
    onPick: p=>{
      const st=S.props[p.id]; const ow=player(st.owner);
      if (p.group==="util"){
        const both = GROUP_MEMBERS.util.every(id=>S.props[id]&&S.props[id].owner===st.owner);
        askDiceTotal({property:p.name, multiplier:both?10:4, payer:pl.name, owner:ow.name}, roll=>{
          const amt = rentFor(p.id, roll);
          transfer(plId, ow.id, amt, "rent — "+p.name+" (rolled "+roll+", \u00d7"+(both?10:4)+")", "rent");
          toast(fmt(amt)+" to "+ow.name);
        });
      } else {
        askAmount({title:"Rent — "+p.name, sub:pl.name+" → "+ow.name, initial:rentFor(p.id), confirmLabel:"Pay rent"}, v=>{
          transfer(plId, ow.id, v, "rent — "+p.name, "rent");
          toast(fmt(v)+" to "+ow.name);
        });
      }
    }
  });
}

/* ----- buying / property lists ----- */
function openBuyProperty(plId){
  const pl = player(plId);
  const avail = BOARD.filter(p=> !S.props[p.id] || !S.props[p.id].owner);
  if (!avail.length){ toast("Everything is owned!"); return; }
  openPropList({
    title: pl.name+" buys…",
    props: avail,
    detail: p=>({right:fmt(p.price), sub:GROUPS[p.group].label}),
    onPick: p=>{
      askAmount({title:"Buy "+p.name, sub:"List price "+fmt(p.price)+" — adjust for auctions", initial:p.price, confirmLabel:"Buy"}, v=>{
        mutate(()=>{
          pl.balance -= v;
          S.props[p.id] = {owner:plId, mortgaged:false, houses:0};
          bump(plId,"propertySpend",v); bump(plId,"propsBought",1);
        }, pl.name+" bought "+p.name+" for "+fmt(v));
        toast(pl.name+" owns "+p.name);
      });
    }
  });
}
function openPropList({title, sub, props, detail, onPick}){

      ${Object.keys(GROUPS).filter(g=>byGroup[g]).map(g=>`
        <div class="grouphdr"><i style="background:${GROUPS[g].color}"></i>${GROUPS[g].label}</div>
        ${byGroup[g].map(p=>{
          const d = detail(p);

function openPropDetail(pid){
  const p = PROP[pid];
  const st = S.props[pid];
  if (!st || !st.owner) return;
  const ow = player(st.owner);
  const mort = Math.floor(p.price/2);
  const unmort = Math.ceil(mort*1.1);
  const isStreet = p.rent !== undefined;
  const canBuild = isStreet && ownsFullGroup(ow.id, p.group) && !groupHasMortgage(p.group);
  const rentRows = isStreet ? `
    <table class="rentgrid">
      <tr class="${st.houses===0 && !canBuild?"cur":""}"><td>Base rent</td><td>${fmt(p.rent[0])}</td></tr>
      <tr class="${st.houses===0 && canBuild?"cur":""}"><td>With full color set</td><td>${fmt(p.rent[0]*2)}</td></tr>
      ${[1,2,3,4].map(n=>`<tr class="${st.houses===n?"cur":""}"><td>${n} house${n>1?"s":""}</td><td>${fmt(p.rent[n])}</td></tr>`).join("")}
      <tr class="${st.houses===5?"cur":""}"><td>Hotel</td><td>${fmt(p.rent[5])}</td></tr>
    </table>` : "";
  const w = openPanel(`
    <h2><span style="color:${GROUPS[p.group].color}">■</span> ${esc(p.name)}</h2>
    <div class="sub">Owned by ${esc(ow.name)} · ${GROUPS[p.group].label}${st.mortgaged? " · MORTGAGED":""}</div>
    <div class="pscroll">
      ${rentRows}
      ${isStreet? `
        <div class="grouphdr">Houses ${canBuild? "· "+fmt(p.house)+" each" : ""}</div>
        ${canBuild || st.houses>0 ? `
        <div class="stepper">
          <button id="pd_minus" ${st.houses<=0?"disabled":""}>−</button>
          <div class="sv">${st.houses===5? "🏨 Hotel" : st.houses+" 🏠"}<small>${st.houses<5&&canBuild? "buy: −"+fmt(p.house):""}${st.houses>0? " · sell: +"+fmt(p.house/2):""}</small></div>
          <button id="pd_plus" ${(st.houses>=5||!canBuild||st.mortgaged)?"disabled":""}>＋</button>
        </div>`:`<div class="note">Houses need the full ${GROUPS[p.group].label} set (unmortgaged).</div>`}
      `:""}
      <div class="grouphdr">Actions</div>
      ${st.houses>0? "" : (st.mortgaged
        ? `<button class="act" id="pd_unmort"><span class="ic">🔓</span>Unmortgage<span class="meta">−${fmt(unmort)}</span></button>`
        : `<button class="act" id="pd_mort"><span class="ic">🔒</span>Mortgage<span class="meta">+${fmt(mort)}</span></button>`)}
      <button class="act" id="pd_xfer"><span class="ic">🔁</span>Transfer to another player…<span class="sub2">for trades — settle cash separately</span></button>
      ${st.houses===0? `<button class="act red" id="pd_return"><span class="ic">↩️</span>Return to Bank${st.mortgaged?"":`<span class="meta">+${fmt(mort)}</span>`}<span class="sub2">sell back at mortgage value</span></button>`:""}
    </div>
  `, w=>{
    const done = ()=>{ closePanel(w); };
    const plus = w.querySelector("#pd_plus"), minus = w.querySelector("#pd_minus");
    if (plus) plus.addEventListener("click", ()=>{
      const hu = housesInUse();
      const wantHotel = st.houses===4;
      if (wantHotel && hu.hotels>=TOTAL_HOTELS) return toast("No hotels left in the bank");
      if (!wantHotel && hu.houses>=TOTAL_HOUSES) return toast("No houses left in the bank");
      done();
      mutate(()=>{ ow.balance -= p.house; S.props[pid].houses++;
        bump(ow.id,"buildingSpend",p.house);
        bump(ow.id, S.props[pid].houses===5 ? "hotelsBuilt" : "housesBuilt", 1); },
        ow.name+" built "+(st.houses===4?"a hotel":"a house")+" on "+p.name+" ("+fmt(p.house)+")");
      openPropDetail(pid);
    });
    if (minus) minus.addEventListener("click", ()=>{
      done();
      mutate(()=>{ ow.balance += p.house/2; S.props[pid].houses--;
        bump(ow.id,"buildingsSold",p.house/2); },
        ow.name+" sold "+(st.houses===5?"the hotel":"a house")+" on "+p.name+" (+"+fmt(p.house/2)+")");
      openPropDetail(pid);
    });
    const m = w.querySelector("#pd_mort");
    if (m) m.addEventListener("click", ()=>{ done();
      mutate(()=>{ ow.balance += mort; S.props[pid].mortgaged = true;
        bump(ow.id,"mortgageProceeds",mort); bump(ow.id,"timesMortgaged",1); },
        ow.name+" mortgaged "+p.name+" (+"+fmt(mort)+")"); });
    const um = w.querySelector("#pd_unmort");
    if (um) um.addEventListener("click", ()=>{ done();
      mutate(()=>{ ow.balance -= unmort; S.props[pid].mortgaged = false;
        bump(ow.id,"unmortgageCost",unmort); },
        ow.name+" unmortgaged "+p.name+" (−"+fmt(unmort)+")"); });
    w.querySelector("#pd_xfer").addEventListener("click", ()=>{ done();
      pickPlayer(p.name+" goes to…", ow.id, toId=>{
        mutate(()=>{ S.props[pid].owner = toId; },
          p.name+" transferred: "+ow.name+" → "+player(toId).name);
        toast(p.name+" → "+player(toId).name);
      });
    });
    const ret = w.querySelector("#pd_return");
    if (ret) ret.addEventListener("click", ()=>{ done();
      const refund = st.mortgaged? 0 : mort;
      mutate(()=>{ ow.balance += refund; delete S.props[pid]; },
        ow.name+" returned "+p.name+" to the Bank"+(refund? " (+"+fmt(refund)+")":""));
    });
  });
}

/* ----- bankruptcy ----- */
function openBankruptcy(plId){
  const pl = player(plId);
  pickPlayer("Who is "+pl.name+" bankrupt to?", plId, credId=>{
    const toBank = credId==="BANK";
    confirmPanel({
      title:"Bankrupt "+pl.name+"?",
      sub: toBank
        ? "All cash is wiped and their properties return to the Bank (houses removed, mortgages cleared)."
        : "All cash ("+fmtS(pl.balance)+") and properties go to "+nameOf(credId)+". Houses are sold to the bank for half value first (per the rules).",
      confirmLabel:"Declare bankruptcy", danger:true
    }, ()=>{
      mutate(()=>{
        // sell buildings back at half price (goes to the bankrupt player first, then transfers)
        for (const pr of playerProps(plId)){
          const st = S.props[pr.id];
          if (st.houses){ pl.balance += (st.houses===5?5:st.houses)*(pr.house/2); st.houses = 0; }
        }
        if (toBank){
          for (const pr of playerProps(plId)) delete S.props[pr.id];
          pl.balance = 0;
        } else {
          const cred = player(credId);
          cred.balance += pl.balance;
          pl.balance = 0;
          for (const pr of playerProps(plId)) S.props[pr.id].owner = credId;
        }
        pl.bankrupt = true;
        const alive = S.players.filter(x=>!x.bankrupt);
        if (alive.length===1){ S.finished = true; S.endedAt = Date.now(); logLine("🏆 "+alive[0].name+" wins the game!"); }
      }, "💀 "+pl.name+" went bankrupt to "+nameOf(credId));
      const alive = S.players.filter(x=>!x.bankrupt);
      if (alive.length===1) toast("🏆 "+alive[0].name+" wins!");
    });
  }, {allowBank:true});
}

/* ================= GAME NIGHT (TV dashboard) =================
   Read-only. Opened as ?tv=<gameId>, polls the saved game every few
   seconds so it follows whatever the banker does on their phone. */
let tvGameId = null, tvTimer = null, tvLastUpdated = null, tvHover = null;

function isTV(){ return new URLSearchParams(location.search).has("tv"); }

async function renderTVBoot(){
  tvGameId = new URLSearchParams(location.search).get("tv");
  document.body.classList.add("tvmode");
  if (!hasCreds() || !session){
    setApp(`<div class="tvsignin"><div class="logo">🎩</div>
      <h1>Game View</h1>
      <p>Sign in on this browser first, then reopen this screen.</p></div>`);
    return;
  }
  setApp(`<div class="tvsignin"><div class="logo">🎩</div><h1>Game View</h1><p>Loading the game…</p></div>`);
  await tvRefresh();
  clearInterval(tvTimer);
  tvTimer = setInterval(()=>{ if (!document.hidden) tvRefresh(); }, 4000);
}

async function tvRefresh(){
  try {
    const row = await fetchGame(tvGameId);
    if (!row){ setApp(`<div class="tvsignin"><h1>Game not found</h1>
      <p>It may have been deleted.</p></div>`); clearInterval(tvTimer); return; }
    S = migrateState(row.state);
    S.name = row.name;
    tvLastUpdated = row.updated_at;
    renderTV();
  } catch(e){
    console.error(e);
    const st = document.querySelector("#tv_live");
    if (st){ st.className = "tvlive err"; st.innerHTML = "<i></i>reconnecting…"; }
  }
}

function elapsedLabel(ms){
  const m = Math.max(0, Math.round(ms/60000));
  return m < 60 ? m + " min" : Math.floor(m/60) + "h " + (m%60) + "m";
}

function renderTV(){
  const pred = predict();
  const hu = housesInUse();
  const alive = S.players.filter(p=>!p.bankrupt);
  const order = S.players.slice().sort((a,b)=>{
    if (a.bankrupt !== b.bankrupt) return a.bankrupt ? 1 : -1;
    return (pred.probs[b.id]||0) - (pred.probs[a.id]||0);
  });

  setApp(`
    <div class="tv">
      <header class="tvhdr">
        <div class="tvtitle">Game View<small>${esc(S.name)}</small></div>
        <div class="tvmeta">
          <span><b>${elapsedLabel(Date.now() - S.createdAt)}</b> elapsed</span>
          <span><b>${alive.length}</b> still in</span>
          <span>🏠 <b>${TOTAL_HOUSES - hu.houses}</b> · 🏨 <b>${TOTAL_HOTELS - hu.hotels}</b> left</span>
          ${S.settings.freeParking ? `<span>🅿️ <b>${fmt(S.freeParking)}</b></span>` : ""}
          <span id="tv_live" class="tvlive"><i></i>live</span>
        </div>
      </header>

      <section class="tvplayers">
        ${order.map(p=>tvPlayerCard(p, pred)).join("")}
      </section>

      <div class="tvside">
      <section class="tvpanel tvpred">
        <h3>Win probability
          <small>${S.finished ? "final" : (pred.decisive < .3 ? "early — anyone's game"
            : pred.decisive < .65 ? "taking shape" : "late game")}</small></h3>
        <div class="fackey">
          <div class="kt">Big bar = chance of winning · small bars = what's driving it,
            each player's share of the table</div>
          <div class="kcols">
            <span>Net worth <i>35%</i></span>
            <span>Monopolies <i>30%</i></span>
            <span>Building <i>20%</i></span>
            <span>Cash <i>15%</i></span>
          </div>
        </div>
        <div class="predlist">
          ${order.filter(p=>!p.bankrupt).map(p=>tvPredRow(p, pred)).join("")}
          ${S.players.filter(p=>p.bankrupt).map(p=>`
            <div class="predrow out">
              ${tokenSVG(p.token, "var(--ink3)", 20)}
              <span class="pname">${esc(p.name)}</span>
              <span class="why">bankrupt</span><span class="pct">—</span>
            </div>`).join("")}
        </div>
      </section>

      <section class="tvpanel tvlog">
        <h3>Game log <small>${S.log.length} events</small></h3>
        <div class="logscroll">
          ${S.log.slice(0,60).map(l=>{
            const d = new Date(l.t);
            return `<div class="tvlogrow"><span class="lt">${d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</span>
              <span class="lx">${esc(l.x)}</span></div>`;
          }).join("") || `<div class="tvempty">Nothing yet — transactions appear here.</div>`}
        </div>
      </section>
      </div>

      <section class="tvpanel tvchart">
        <h3>Win probability over time<small>each player's chance of winning after every move</small></h3>
        <div class="chartlegend">${S.players.map(p=>`
          <span class="lgd"><i style="background:${p.color}"></i>${esc(p.name)}</span>`).join("")}</div>
        <div id="tv_chart" class="chartbox"></div>
      </section>
    </div>
  `);
  drawProbChart(pred);
}

function tvPlayerCard(p, pred){
  const owned = playerProps(p.id);
  const byGroup = {};
  owned.forEach(pr=>{ (byGroup[pr.group] = byGroup[pr.group]||[]).push(pr); });
  const monos = Object.keys(GROUP_CLOUT).filter(g=>ownsFullGroup(p.id,g));
  let houses=0, hotels=0;
  owned.forEach(pr=>{ const st=S.props[pr.id]; if (st.houses===5) hotels++; else houses+=st.houses||0; });
  const pct = Math.round((pred.probs[p.id]||0)*100);
  return `
    <article class="tvcard ${p.bankrupt?"out":""} ${pred.leader===p.id && !p.bankrupt?"lead":""}">
      <div class="stripe" style="background:${p.color}"></div>
      <div class="tvtop">
        ${tokenSVG(p.token, p.color, 40)}
        <div class="tvname">${esc(p.name)}${pred.leader===p.id && !p.bankrupt?` <span class="crown">leading</span>`:""}</div>
        <div class="tvcash ${p.balance<0?"neg":""}">${fmtS(p.balance)}</div>
      </div>
      <div class="tvstats">
        <span><b>${fmt(netWorth(p))}</b> net worth</span>
        <span><b>${owned.length}</b> properties</span>
        <span><b>${monos.length}</b> monopolies</span>
        <span><b>${houses}</b>🏠 <b>${hotels}</b>🏨</span>
        ${p.bankrupt?"":`<span class="odds"><b>${pct}%</b> to win</span>`}
      </div>
      <div class="tvprops">
        ${Object.keys(GROUPS).filter(g=>byGroup[g]).map(g=>`
          <span class="grp ${monos.includes(g)?"full":""}" style="--gc:${GROUPS[g].color}">
            ${byGroup[g].map(pr=>{
              const st = S.props[pr.id];
              const badge = st.houses===5 ? "🏨" : (st.houses ? String(st.houses) : "");
              return `<span class="pc ${st.mortgaged?"mort":""}" title="${esc(pr.name)}"
                style="color:${inkOn(GROUPS[g].color)}">
                ${esc(shortName(pr))}${badge?`<i>${badge}</i>`:""}</span>`;
            }).join("")}
          </span>`).join("") || `<span class="tvempty">no property yet</span>`}
      </div>
    </article>`;
}

function shortName(pr){
  if (pr.group==="rail") return pr.name.replace(" Railroad","").replace("Reading","Read.").replace("Pennsylvania","Penn.").replace("B. & O.","B&O").replace("Short Line","Short L.");
  if (pr.group==="util") return pr.name.replace("Electric Company","Electric").replace("Water Works","Water");
  return pr.name.replace(" Avenue","").replace(" Ave","").replace(" Place","").replace(" Gardens","Gdns")
    .replace("North Carolina","N. Carolina").replace("Mediterranean","Medit.").replace("Connecticut","Connect.")
    .replace("Pennsylvania","Penn.").replace("St. Charles","St. Charles");
}

function tvPredRow(p, pred){
  const pct = (pred.probs[p.id]||0)*100;
  const f = pred.factors[p.id] || {};
  const bar = (k,label) => {
    const fp = Math.round((f[k]||0)*100);
    return `<span class="fcell" title="${label} — ${fp}% of the table">
      <i class="fnum">${fp}%</i>
      <span class="fbar"><i style="width:${fp}%; background:${p.color}"></i></span></span>`;
  };
  return `
    <div class="predrow ${pred.leader===p.id?"lead":""}">
      ${tokenSVG(p.token, p.color, 22)}
      <span class="pname">${esc(p.name)}</span>
      <span class="why">${esc(predictWhy(p.id, f))}</span>
      <span class="pct">${pct<1?"<1":Math.round(pct)}%</span>
      <span class="pbar"><i style="width:${Math.max(1,pct)}%; background:${p.color}"></i></span>
      <span class="factors">
        ${bar("netWorth","Net worth")}${bar("monopolies","Monopolies")}
        ${bar("development","Development")}${bar("cash","Cash cushion")}
      </span>
    </div>`;
}


/* ---- Win-probability timeline: one 2px line per player ----
   Trend over time with the series as the subject → multi-line, categorical
   colour. Endpoints get a marker + direct label (dodged so they never
   collide); a crosshair reads out every player at any point in the game. */
function drawProbChart(pred){
  const box = document.querySelector("#tv_chart");
  if (!box) return;
  const series = S.players;
  let pts = (S.probTimeline||[]).slice().sort((a,b)=>a.t-b.t);
  const now = series.map(p=>pred.probs[p.id]||0);
  const lastT = pts.length ? pts[pts.length-1].t : S.createdAt;
  pts.push({ t: Math.max(Date.now(), lastT + 1000), p: now });
  if (pts.length < 2) pts.unshift({ t: S.createdAt, p: series.map(()=>1/Math.max(1,series.length)) });

  const W = box.clientWidth || 900, H = box.clientHeight || 260;
  const m = { t:12, r:120, b:26, l:44 };
  const iw = Math.max(10, W - m.l - m.r), ih = Math.max(10, H - m.t - m.b);
  const n = pts.length;
  const X = i => m.l + (n<2 ? iw : (i/(n-1))*iw);
  const Y = v => m.t + (1 - v) * ih;

  // normalise each sample so the lines are a true share of 100%
  const val = (j,i) => {
    const total = pts[j].p.reduce((a,b)=>a+b,0) || 1;
    return pts[j].p[i]/total;
  };

  const grid = [0,0.25,0.5,0.75,1].map(v=>
    `<line class="gl" x1="${m.l}" y1="${Y(v)}" x2="${m.l+iw}" y2="${Y(v)}"/>
     <text class="ax" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v*100}%</text>`).join("");

  const lines = series.map((p,i)=>{
    const d = pts.map((s,j)=>`${X(j).toFixed(1)},${Y(val(j,i)).toFixed(1)}`).join("L");
    return `<path d="M${d}" fill="none" stroke="${p.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" opacity="${p.bankrupt?".35":"1"}"/>`;
  }).join("");

  // endpoint markers + direct labels, dodged apart so they stay readable
  const ends = series.map((p,i)=>({ p, i, v:val(n-1,i), y:Y(val(n-1,i)) }))
                     .sort((a,b)=>a.y-b.y);
  const gap = 15;
  for (let k=1;k<ends.length;k++)
    if (ends[k].y - ends[k-1].y < gap) ends[k].y = ends[k-1].y + gap;
  const overflow = ends.length ? ends[ends.length-1].y - (m.t+ih) : 0;
  if (overflow > 0) ends.forEach(e=>{ e.y -= overflow; });

  const markers = ends.map(e=>`
    <circle cx="${X(n-1)}" cy="${Y(e.v)}" r="4.5" fill="${e.p.color}"
      stroke="var(--card)" stroke-width="2" opacity="${e.p.bankrupt?".35":"1"}"/>`).join("");
  const labels = ends.map(e=>`
    <text class="dl" x="${m.l+iw+12}" y="${e.y+4}" opacity="${e.p.bankrupt?".45":"1"}"
      >${esc(e.p.name)} <tspan style="fill:${e.p.color}; font-weight:900"
      >${Math.round(e.v*100)}%</tspan></text>`).join("");

  const mins = Math.max(0, Math.round((pts[n-1].t - pts[0].t)/60000));
  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img"
      aria-label="Each player's chance of winning after every move of the game">
      ${grid}
      ${lines}
      ${markers}
      ${labels}
      <text class="ax" x="${m.l}" y="${H-8}">game start</text>
      <text class="ax" x="${m.l+iw}" y="${H-8}" text-anchor="end">now · ${n} moves · ${mins} min</text>
      <g id="tv_cross" style="display:none">
        <line class="cross" y1="${m.t}" y2="${m.t+ih}"/>
        ${series.map(p=>`<circle class="chd" r="4.5" fill="${p.color}"
          stroke="var(--card)" stroke-width="2"/>`).join("")}
      </g>
      <rect id="tv_hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg>
    <div id="tv_tip" class="charttip" hidden></div>`;

  const svg = box.querySelector("svg"), hit = box.querySelector("#tv_hit");
  const cross = box.querySelector("#tv_cross"), line = cross.querySelector("line");
  const dots = [...cross.querySelectorAll(".chd")], tip = box.querySelector("#tv_tip");
  hit.addEventListener("mousemove", ev=>{
    const r = svg.getBoundingClientRect();
    const sx = (ev.clientX - r.left) * (W / r.width);
    const frac = Math.min(1, Math.max(0, (sx - m.l)/iw));
    const k = Math.round(frac * (n-1));
    const px = X(k);
    line.setAttribute("x1", px); line.setAttribute("x2", px);
    dots.forEach((c,i)=>{ c.setAttribute("cx", px); c.setAttribute("cy", Y(val(k,i))); });
    cross.style.display = "";
    const rows = series.map((p,i)=>({ p, v: val(k,i) }))
      .sort((a,b)=>b.v-a.v)
      .map(x=>`<div><i style="background:${x.p.color}"></i>${esc(x.p.name)}
        <b>${Math.round(x.v*100)}%</b></div>`).join("");
    tip.innerHTML = `<div class="tt">move ${k+1} of ${n}</div>${rows}`;
    tip.hidden = false;
    tip.style.left = Math.min(box.clientWidth-170, Math.max(0, px*(box.clientWidth/W) + 12)) + "px";
  });
  hit.addEventListener("mouseleave", ()=>{ cross.style.display="none"; tip.hidden = true; });
}

let tvResize = null;
window.addEventListener("resize", ()=>{
  if (!isTV() || !S) return;
  clearTimeout(tvResize);
  tvResize = setTimeout(()=>renderTV(), 200);
});

/* ---------------- boot ---------------- */
if (parseHashSession()) toast("Signed in as " + (session.user.name || "you"));
if (isTV()) renderTVBoot(); else renderHome();
